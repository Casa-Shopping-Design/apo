name: Segurança

on:
  pull_request:
  push:
    branches: [main]
  # Toda segunda às 9h07 UTC, para pegar regra nova do CodeQL em código que não mudou.
  schedule:
    - cron: "7 9 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Sem build: o código é analisado como está. security-extended inclui as regras de injeção,
      # autorização e desserialização além das padrão.
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /linguagem:${{ matrix.linguagem }}

  segredos:
    name: Segredos nos commits do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # O binário vem da release oficial, conferido contra o sha256 gravado aqui; a action oficial pede
      # licença para repositório de organização.
      - name: Instalar gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # Só os commits do PR: o histórico antigo já passou pela varredura do GitHub.
      - name: Varrer os commits do PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --redact --no-banner --log-opts="$BASE..$HEAD" .
